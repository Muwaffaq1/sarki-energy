<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SegmentedControl</title></head>
<body>
<div id="root" class="se-stack"></div>
<script>
  var S = window.Sarki, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(S.SegmentedControl, { options: ['Day', 'Week', 'Month', 'Year'], defaultValue: 'Week', label: 'Period' }),
    h(S.SegmentedControl, { options: [{ value: 'kwh', label: 'kWh' }, { value: 'ngn', label: '\u20A6' }], label: 'Units' })));
</script>
</body>
</html>
